<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple to-do list for adding and completing tasks." />
    <title>My Tasks | To-Do List</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main class="app-card" aria-labelledby="page-title">
      <header class="app-header">
        <h1 id="page-title">My Tasks</h1>
        <p class="intro">Add tasks, then mark them complete as you go.</p>
      </header>

      <p class="motivational-quote" id="motivational-quote" aria-live="polite"></p>

      <section class="task-composer" aria-labelledby="composer-title">
        <div class="section-heading">
          <h2 id="composer-title">Add a task</h2>
        </div>
        <form class="task-form" id="task-form">
          <label class="visually-hidden" for="task-input">Task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            placeholder="What needs to get done?"
            autocomplete="off"
            aria-describedby="form-message"
            required
          />
          <button class="add-button" type="submit">Add task</button>
        </form>
      </section>
      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>

      <section class="task-section" aria-label="Your task list">
        <ul class="task-list" id="task-list" aria-live="polite">
        </ul>
      </section>
    </main>
  </body>
</html>
